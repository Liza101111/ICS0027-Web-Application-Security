<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Files - Secure File Vault</title>
</head>
<body>

    <h1>My Files</h1>

    <p>Welcome, {{ current_user.username }}</p>

    <p>
        <a href="{{ url_for('upload') }}">Upload File</a>
    </p>

    {% if files %}
        <ul>
            {% for file in files %}
                <li>{{ file.original_filename }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no files yet.</p>
    {% endif %}

    <p>
        <a href="{{ url_for('home') }}">Back to home</a>
    </p>

</body>
</html>
