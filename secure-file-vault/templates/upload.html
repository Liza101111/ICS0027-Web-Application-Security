<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - Secure File Vault</title>
</head>
<body>

    <h1>Upload File</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}

        <p>
            {{ form.file.label }}<br>
            {{ form.file() }}
        </p>

        <p>
            {{ form.submit() }}
        </p>
    </form>

    <p>
        <a href="{{ url_for('files') }}">Back to My Files</a>
    </p>

</body>
</html>
